name: Build and Release NexTerm
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexterm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.1.${GITHUB_RUN_NUMBER}"
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Install native toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Validate and build development APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --max-workers=2
      - name: Prepare development download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NexTerm-v${VERSION_NAME}-development.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "dist/NexTerm-v${VERSION_NAME}-development.apk"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Development prerelease
          This build is unfinished. Linux bootstrap, full VT rendering, LSP and Git integration are not implemented. See README for the full status.

          The development APK is debug-signed and debuggable. It is for testing, not production use. Its signing key can change between workflow runs: upgrading may require uninstalling the previous development build, which deletes its private workspace. Export important files before uninstalling. No production signing credentials are included.
          NOTES
      - name: Check signing configuration
        if: github.event_name != 'pull_request'
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          count=0
          for name in SIGNING_KEY KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -n "${!name}" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" == 0 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No release signing secrets configured; publishing development APK only.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$count" != 4 ]]; then
            echo '::error::Configure all four signing secrets or remove the incomplete configuration.'
            exit 1
          else
            umask 077
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --max-workers=2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/release/app-release.apk "dist/NexTerm-v${VERSION_NAME}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/NexTerm-v${VERSION_NAME}-release.aab"
          echo 'Release APK and AAB signed with the configured repository keystore are also attached. The application remains incomplete.' >> "$RUNNER_TEMP/release-notes.md"
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          if compgen -G '*.aab' > /dev/null; then sha256sum *.aab >> SHA256SUMS.txt; fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexTerm-v${{ env.VERSION_NAME }}
          path: dist/*
          if-no-files-found: error
      - name: Publish versioned prerelease
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: NexTerm v${{ env.VERSION_NAME }}
          prerelease: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
